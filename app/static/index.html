<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomato Pomodoro</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/tomato.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-6">
  <div class="max-w-6xl mx-auto">
    <header class="flex flex-wrap items-center justify-between gap-4 mb-8 bg-white p-4 rounded-xl shadow-sm">
      <div class="flex items-center gap-3">
        <img src="/tomato.png" alt="Tomato" class="w-10 h-10 object-contain">
        <h1 class="text-xl font-bold text-rose-600">Tomato Focus Kanban</h1>
      </div>
      <div class="flex items-center gap-4">
        <label class="text-sm font-medium">User Profile:</label>
        <input id="userInput" type="text" value="xerxes" onchange="loadTasks()" class="border px-3 py-1.5 rounded-lg text-sm bg-slate-50 focus:outline-rose-500">
      </div>
    </header>

    <!-- Timer Section -->
    <div class="bg-rose-50 border border-rose-200 rounded-xl p-6 mb-8 text-center shadow-sm">
      <p id="timerState" class="text-sm font-semibold text-rose-500 uppercase tracking-wide">Focus Session</p>
      <h2 id="timerDisplay" class="text-6xl font-extrabold text-rose-600 my-2">25:00</h2>
      <p id="activeTaskLabel" class="text-sm text-slate-600 mb-4">No task in progress</p>
      <div class="flex justify-center gap-3">
        <button id="startBtn" onclick="toggleTimer()" class="bg-rose-600 hover:bg-rose-700 text-white px-6 py-2 rounded-lg font-semibold shadow">Start Focus</button>
        <button onclick="resetTimer()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm">Reset</button>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-wrap gap-4 mb-6">
      <input id="newTaskTitle" type="text" placeholder="Add a new task..." class="border px-4 py-2 rounded-lg flex-1 shadow-sm">
      <button onclick="addTask()" class="bg-slate-900 hover:bg-black text-white px-5 py-2 rounded-lg font-medium shadow-sm">Add Task</button>
      <label class="bg-white border hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg font-medium shadow-sm cursor-pointer">
        Upload PDF Syllabus
        <input type="file" id="pdfFileInput" accept="application/pdf" onchange="uploadPdf()" class="hidden">
      </label>
    </div>

    <!-- Kanban Columns -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-slate-200/70 p-4 rounded-xl">
        <h3 class="font-bold mb-3 text-slate-700">To-Do</h3>
        <div id="col-todo" class="space-y-2"></div>
      </div>
      <div class="bg-amber-100/60 p-4 rounded-xl">
        <h3 class="font-bold mb-3 text-amber-800">Pomodoro Queue</h3>
        <div id="col-pomodoro" class="space-y-2"></div>
      </div>
      <div class="bg-rose-100/60 p-4 rounded-xl">
        <h3 class="font-bold mb-3 text-rose-800">In Progress</h3>
        <div id="col-in_progress" class="space-y-2"></div>
      </div>
      <div class="bg-emerald-100/60 p-4 rounded-xl">
        <h3 class="font-bold mb-3 text-emerald-800">Completed</h3>
        <div id="col-completed" class="space-y-2"></div>
      </div>
    </div>
  </div>

  <script>
    let timeLeft = 25 * 60;
    let timerId = null;
    let isRest = false;
    let currentTask = null;

    function getUsername() {
      return document.getElementById("userInput").value.trim().toLowerCase() || "xerxes";
    }

    async function loadTasks() {
      const res = await fetch(`/api/tasks?username=${getUsername()}`);
      const tasks = await res.json();
      ["todo", "pomodoro", "in_progress", "completed"].forEach(col => {
        document.getElementById(`col-${col}`).innerHTML = "";
      });
      tasks.forEach(task => {
        const card = document.createElement("div");
        card.className = "bg-white p-3 rounded-lg shadow-sm border border-slate-200 flex flex-col gap-2";
        card.innerHTML = `
          <div class="text-sm font-medium">${task.title}</div>
          <div class="text-xs text-slate-500">Pomos: ${task.completed_pomodoros}</div>
          <div class="flex gap-1 mt-1 text-xs">
            ${task.status !== 'pomodoro' ? `<button onclick="moveTask('${task.id}', 'pomodoro')" class="px-2 py-1 bg-amber-50 text-amber-700 rounded border">Queue</button>` : ''}
            ${task.status !== 'in_progress' ? `<button onclick="startFocusTask('${task.id}', '${task.title}')" class="px-2 py-1 bg-rose-50 text-rose-700 rounded border">Focus</button>` : ''}
            ${task.status !== 'completed' ? `<button onclick="moveTask('${task.id}', 'completed')" class="px-2 py-1 bg-emerald-50 text-emerald-700 rounded border">Done</button>` : ''}
          </div>
        `;
        const colElem = document.getElementById(`col-${task.status}`);
        if (colElem) colElem.appendChild(card);
      });
    }

    async function addTask() {
      const title = document.getElementById("newTaskTitle").value.trim();
      if (!title) return;
      await fetch("/api/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: getUsername(), title })
      });
      document.getElementById("newTaskTitle").value = "";
      loadTasks();
    }

    async function moveTask(id, status) {
      await fetch(`/api/tasks/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status })
      });
      loadTasks();
    }

    async function startFocusTask(id, title) {
      currentTask = { id, title };
      document.getElementById("activeTaskLabel").innerText = `Focusing on: ${title}`;
      await moveTask(id, "in_progress");
      resetTimer();
      toggleTimer();
    }

    function updateTimerDisplay() {
      const m = Math.floor(timeLeft / 60).toString().padStart(2, "0");
      const s = (timeLeft % 60).toString().padStart(2, "0");
      document.getElementById("timerDisplay").innerText = `${m}:${s}`;
    }

    function toggleTimer() {
      const btn = document.getElementById("startBtn");
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
        btn.innerText = "Resume";
      } else {
        btn.innerText = "Pause";
        timerId = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateTimerDisplay();
          } else {
            clearInterval(timerId);
            timerId = null;
            handleIntervalComplete();
          }
        }, 1000);
      }
    }

    async function handleIntervalComplete() {
      if (!isRest) {
        if (currentTask) {
          const finished = confirm(`25-minute Pomodoro finished! Did you complete: "${currentTask.title}"?`);
          if (finished) {
            await moveTask(currentTask.id, "completed");
            currentTask = null;
            document.getElementById("activeTaskLabel").innerText = "No task in progress";
          }
        }
        alert("Starting 5-minute break.");
        isRest = true;
        timeLeft = 5 * 60;
        document.getElementById("timerState").innerText = "Rest Interval";
      } else {
        alert("Break over! Ready for your next focused session.");
        isRest = false;
        timeLeft = 25 * 60;
        document.getElementById("timerState").innerText = "Focus Session";
      }
      updateTimerDisplay();
      document.getElementById("startBtn").innerText = "Start Focus";
    }

    function resetTimer() {
      clearInterval(timerId);
      timerId = null;
      isRest = false;
      timeLeft = 25 * 60;
      document.getElementById("timerState").innerText = "Focus Session";
      document.getElementById("startBtn").innerText = "Start Focus";
      updateTimerDisplay();
    }

    async function uploadPdf() {
      const input = document.getElementById("pdfFileInput");
      if (!input.files[0]) return;
      const formData = new FormData();
      formData.append("file", input.files[0]);
      await fetch(`/api/upload-pdf?username=${getUsername()}`, {
        method: "POST",
        body: formData
      });
      input.value = "";
      loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
